<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محرر النص الصافي - البطولة</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdn.ckeditor.com/ckeditor5/40.0.0/classic/ckeditor.js"></script>

    <link rel="stylesheet" href="css/editor.css" />
  </head>
  <body>
    <div class="editor">
      <div class="editor-container">
        <div class="header">
          <h2><i class="fa-solid fa-file-lines"></i> اكتب مقالك هنا</h2>
          <span id="copyStatus"
            ><i class="fa-solid fa-check"></i> تم نسخ النص </span
          >
        </div>

        <div id="editor"></div>

        <div class="actions">
          <button class="btn btn-copy" onclick="copyPlainText()">
            <i class="fa-regular fa-copy"></i>
            نسخ النص
          </button>
          <button class="btn btn-clear" onclick="clearAll()">
            <i class="fa-solid fa-eraser"></i>
            مسح
          </button>
            
        </div>
      </div>
    </div>

    <script>
      let editorInstance;

      ClassicEditor.create(document.querySelector("#editor"), {
        language: "ar",
        placeholder: "اكتب المحتوى هنا...",
        toolbar: [
          "bold",
          "italic",
          "bulletedList",
          "numberedList",
          "undo",
          "redo",
        ],
      }).then((editor) => {
        editorInstance = editor;
      });

      function copyPlainText() {
        const htmlData = editorInstance.getData();
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = htmlData;
        const plainText = tempDiv.innerText || tempDiv.textContent || "";

        if (!plainText.trim()) {
          alert("المحرر فارغ!");
          return;
        }

        navigator.clipboard.writeText(plainText).then(() => {
          const status = document.getElementById("copyStatus");
          status.style.display = "inline";
          setTimeout(() => {
            status.style.display = "none";
          }, 2000);
        });
      }

      function clearAll() {
        if (confirm("امسح كل شيء")) editorInstance.setData("");
      }
    </script>
  </body>
</html>

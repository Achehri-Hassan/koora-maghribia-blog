<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - البطولة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        /* جعل الخلفية رمادية باهتة لتبرز الحاوية البيضاء */
        body {
            background-color: #e9ecef; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* الحاوية المركزية الصغيرة */
        .login-card {
            display: flex;
            width: 85%;            /* عرض الحاوية بالنسبة للشاشة */
            max-width: 900px;      /* أقصى عرض باش ما توليش كبيرة بزاف */
            height: 550px;         /* طول محدد وأنيق */
            background: #fff;
            border-radius: 20px;   /* زوايا دائرية */
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); /* ظل ليعطي عمق */
        }

        /* جهة الفورم */
        .form-side {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header i {
            font-size: 2rem;
            color: #1a7e4a;
            margin-bottom: 10px;
        }

        .form-header h1 {
            font-size: 1.5rem;
            color: #333;
        }

        .line {
            width: 35px;
            height: 3px;
            background: #1a7e4a;
            margin: 8px auto;
        }

        /* المدخلات */
        .input-group {
            text-align: right;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fdfdfd;
            outline: none;
        }

        .input-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        /* الزر */
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1a7e4a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #145e38;
        }

        .divider {
            margin: 15px 0;
            text-align: center;
            color: #bbb;
            font-size: 0.8rem;
        }

        .btn-reg {
            width: 100%;
            padding: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* جهة الصورة */
        .image-side {
            flex: 1.1;
            position: relative;
        }

        .image-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay-text {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .overlay-text h2 span {
            color: #1a7e4a;
        }

        /* الموبايل */
        @media (max-width: 768px) {
            .image-side { display: none; }
            .login-card { max-width: 400px; height: auto; padding: 20px 0; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        
        <!-- الفورم -->
        <div class="form-side">
            <div class="form-header">
                <i class="fa-solid fa-trophy"></i>
                <h1>تسجيل الدخول</h1>
                <div class="line"></div>
            </div>

            <form>
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-box">
                        <input type="email" placeholder="email@example.com">
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label>كلمة المرور</label>
                    <div class="input-box">
                        <input type="password" placeholder="••••••••">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login">تسجيل الدخول</button>

                <div class="divider">أو</div>

                <button type="button" class="btn-reg">
                   <i class="fa-solid fa-user-plus"></i> إنشاء حساب جديد
                </button>
            </form>
        </div>

        <!-- الصورة -->
        <div class="image-side">
            <img src="hakim.png" alt="Player">
          
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محرر البطولة - إرسال مباشر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.ckeditor.com/ckeditor5/40.0.0/classic/ckeditor.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .ck-editor__editable { min-height: 450px; font-size: 18px; }
        .ck-powered-by { display: none !important; }
        .btn-send { 
            background-color: #27ae60; color: white; border: none; padding: 15px 30px; 
            border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold;
            margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-send:hover { background-color: #219150; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0;"><i class="fa-solid fa-pen-nib"></i> محرر المحتوى</h2>
    <div id="editor"></div>
    <button class="btn-send" onclick="sendToParent()">
        <i class="fa-solid fa-paper-plane"></i> حفظ وإرسال لصفحة التعديل
    </button>
</div>

<script>
    let editorInstance;

    // تشغيل المحرر
    ClassicEditor.create(document.querySelector('#editor'), {
        language: 'ar',
        toolbar: ['heading', '|', 'bold', 'italic', 'link', 'bulletedList', 'numberedList', '|', 'insertImage', 'undo', 'redo']
    })
    .then(editor => {
        editorInstance = editor;
        // إلا كان ديجا كاين نص فـ صفحة التعديل، جيبو هنا باش تكمل عليه
        if (window.opener && window.opener.document.getElementById('mainContent')) {
            editor.setData(window.opener.document.getElementById('mainContent').value);
        }
    });

    function sendToParent() {
        const data = editorInstance.getData();

        // التأكد أن الصفحة الأصلية مازال محلولة
        if (window.opener && !window.opener.closed) {
            // صيفط الداتا لـ textarea اللي عندها id="mainContent" فـ صفحة Update
            window.opener.document.getElementById('mainContent').value = data;
            
            // سد المحرر ورجع لصفحة التعديل
            window.close();
        } else {
            alert("خطأ: صفحة التعديل مغلقة! قم بنسخ النص يدوياً.");
        }
    }
</script>
</body>
</html>
